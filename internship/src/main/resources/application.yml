spring:
  application:
    name: neuralshield

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neuralshield}
    username: ${DB_USER:neuralshield}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  security:
    require-ssl: false            # Set true behind TLS termination in prod

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html
  error:
    include-message: never        # Never leak stack traces to clients
    include-stacktrace: never

# JWT Configuration — override via env vars in production
neuralshield:
  jwt:
    secret: ${JWT_SECRET}         # Must be set — no default, fails fast on startup
    expiry-ms: ${JWT_EXPIRY_MS:3600000}   # 1 hour default
  api-key:
    value: ${API_KEY}             # Must be set — no default
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:20}
    refill-per-minute: ${RATE_LIMIT_REFILL:10}

# Actuator — only health and info exposed externally
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}  # Disabled in prod by default

logging:
  level:
    root: INFO
    com.neuralshield: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
